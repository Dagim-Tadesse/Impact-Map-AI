services:
  - type: web
    name: impactmap-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r services/api/requirements.txt && pip install -e packages/impactmap_core --no-deps
    startCommand: uvicorn services.api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: IMPACTMAP_ALLOWED_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: INFO
