name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pip install -e packages/impactmap_core
      - run: ruff check .
      - run: pytest
      - run: pip-audit -r requirements-dev.txt

  # Web job is commented out until Anon pushes the initial Vite/React scaffold (Task T1)
  # web:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #     - run: npm ci
  #       working-directory: web
  #     - run: npm run lint
  #       working-directory: web
  #     - run: npm test
  #       working-directory: web
  #     - run: npm run build
  #       working-directory: web

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g aws-cdk
      - run: pip install -r infra/requirements.txt
      # Will run cdk synth once CDK stacks and app.py are in place
      - run: echo "Infra setup validated"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v ${{ github.workspace }}:/repo ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-banner

  all-checks:
    needs: [python, infra, secrets]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
